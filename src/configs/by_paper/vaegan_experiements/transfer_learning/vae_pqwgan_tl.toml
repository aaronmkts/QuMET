# basics
model = "pqwgan_qc"
dataset = "mnist"
seed = 24
add_vae = true # ADDS VAE component

# training
training_optimizer = "adam"
learning_rate = 1e-2
max_epochs = 15
batch_size = 16
n_samples = 2600

# torch lightning
task = "image_generation"
num_workers = 0
num_devices = 1
accelerator = "cpu"
project = 'QMI-ModeCollapse'
load_name = "../src/test/analysis/artifacts/model-dmssusha:v1/model.ckpt"
load_type = "pl"


report_to= "wandb"
run_name = "vaeqwgan_mnist017_seed24_TLv1"
# metrics configuration
[metrics]
use_metrics = [ 'TSNEPlotCallback', 'GMMEvaluationCallback', 'FID', 'NDB_JSD', 'GANImagesCallback',
'CosineSimilarity','PSNR','SSIM']

# Define initialization parameters for each metric


[metrics.TSNEPlotCallback]
every_n_epochs = 2

[metrics.GMMEvaluationCallback]
gmm_components=3
save_gmm=true
gmm_save_path='gmm_model_mnist017_seed24_TLv1.pkl'

[metrics.FIDEvaluationCallback]
every_n_epochs = 1

[metrics.NDB_JSD_EvaluationCallback]
every_n_epochs = 1
number_of_bins=50
significance_level=0.05
z_threshold= "NA"
whitening=false
max_dims= "NA"


[metrics.CosineSimilarityCallback]
every_n_epochs = 1

[metrics.PSNR]
every_n_epochs = 1

[metrics.SSIM]
every_n_epochs =1
