[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
  | \.eggs
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | ckpts
  | qumet_output
  | \.main_cache
  | \.qumet_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
extend_skip_glob = ["ckpts/*", "qumet_output/*", ".main_cache/*", ".qumet_cache/*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "build",
    "dist",
    "ckpts",
    "qumet_output",
    ".main_cache",
    ".qumet_cache",
]

[tool.ruff.lint]
# Start with a minimal, essential rule set
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ files
"src/test/**" = ["F401", "F841"]  # Allow unused imports/variables in test files

[tool.pytest.ini_options]
testpaths = ["src/test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
